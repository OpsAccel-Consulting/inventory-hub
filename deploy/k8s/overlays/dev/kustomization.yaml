apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: inventory-hub

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/environment: dev
    includeSelectors: false

# app.env is (re)written by the deploy pipeline from SSM Parameter Store
# (/inventory-hub/dev/*). The committed copy only holds placeholders.
configMapGenerator:
  - name: inventory-hub-config
    envs:
      - app.env

patches:
  - target:
      kind: Deployment
      name: inventory-hub
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Ingress
      name: inventory-hub
    patch: |-
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1load-balancer-name
        value: inventory-hub-dev
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1tags
        value: Environment=dev,Project=inventory-hub
