apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: inventory-hub

labels:
  - pairs:
      app.kubernetes.io/name: inventory-hub
      app.kubernetes.io/part-of: inventory-hub
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pdb.yaml

# CI/CD replaces this with the ECR image built for the commit:
#   kustomize edit set image inventory-hub=<registry>/inventory-hub:<git-sha>
images:
  - name: inventory-hub
    newTag: latest
