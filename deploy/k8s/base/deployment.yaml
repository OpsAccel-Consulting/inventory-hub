apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-hub
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-hub
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-hub
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: inventory-hub
      # AWS credentials arrive via the EKS Pod Identity webhook (its own projected
      # token volume), so the Kubernetes API token stays unmounted.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: inventory-hub
              app.kubernetes.io/component: web

      # Runs schema migrations before the app starts. Safe with many replicas:
      # migrations/env.py takes a PostgreSQL advisory lock.
      initContainers:
        - name: migrate
          image: inventory-hub
          command: ["flask", "db", "upgrade"]
          envFrom:
            - configMapRef:
                name: inventory-hub-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }

      containers:
        - name: web
          image: inventory-hub
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: inventory-hub-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # Give the ALB time to deregister the target before shutdown
              sleep:
                seconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
