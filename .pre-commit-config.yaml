# Git hooks that run on every `git commit`.
#   pip install pre-commit && pre-commit install      (once per clone)
#   pre-commit run --all-files                        (check the whole repo)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.100.0
    hooks:
      - id: terraform_fmt

  # Block 12-digit AWS account IDs from being committed (security policy)
  - repo: local
    hooks:
      - id: no-aws-account-ids
        name: Block AWS account IDs
        language: pygrep
        entry: '(?<![0-9])[0-9]{12}(?![0-9])'
        exclude: '(\.terraform\.lock\.hcl|migrations/versions/)'
